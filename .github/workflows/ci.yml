name: OrangeHRM demo testing

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.10', '3.11' ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip & install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Google Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install ChromeDriver (auto-match Chrome)
        uses: nanasess/setup-chromedriver@v2

      - name: Run smoke tests (no fail-fast)
        run: |
          pytest -m smoke tests/test_login.py tests/test_open_recruitment.py \--html=report.html --self-contained-html

      - name: Upload Test Report (always)
        if: always()          
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-report-${{ matrix.python-version }}
          path: report.html
